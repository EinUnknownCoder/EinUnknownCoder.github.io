<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogalerie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Fotogalerie</h1>
    </header>

    <main>
        <div class="gallery">
            <div class="gallery-item">
                <img src="images/gallery-01.jpg" alt="Gallery Image 1" data-src="images/gallery-01.jpg">
            </div>
            <div class="gallery-item">
                <img src="images/gallery-02.jpg" alt="Gallery Image 2" data-src="images/gallery-02.jpg">
            </div>
            <div class="gallery-item">
                <img src="images/gallery-03.jpg" alt="Gallery Image 3" data-src="images/gallery-03.jpg">
            </div>
            <div class="gallery-item">
                <img src="images/gallery-04.jpg" alt="Gallery Image 4" data-src="images/gallery-04.jpg">
            </div>
            <div class="gallery-item">
                <img src="images/gallery-05.jpg" alt="Gallery Image 5" data-src="images/gallery-05.jpg">
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Fotogalerie. Alle Rechte vorbehalten.</p>
    </footer>

    <div id="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <script src="js/main.js"></script>

</body>
</html>
