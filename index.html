<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogalerie</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Fotogalerie</h1>
    </header>

    <div class="gallery">
        <div class="gallery-item"><img src="https://via.placeholder.com/400x400.png?text=Foto+1" alt="Foto 1" data-src="https://via.placeholder.com/800x800.png?text=Foto+1"></div>
        <div class="gallery-item"><img src="https://via.placeholder.com/400x400.png?text=Foto+2" alt="Foto 2" data-src="https://via.placeholder.com/800x800.png?text=Foto+2"></div>
        <div class="gallery-item"><img src="https://via.placeholder.com/400x400.png?text=Foto+3" alt="Foto 3" data-src="https://via.placeholder.com/800x800.png?text=Foto+3"></div>
        <div class="gallery-item"><img src="https://via.placeholder.com/400x400.png?text=Foto+4" alt="Foto 4" data-src="https://via.placeholder.com/800x800.png?text=Foto+4"></div>
        <div class="gallery-item"><img src="https://via.placeholder.com/400x400.png?text=Foto+5" alt="Foto 5" data-src="https://via.placeholder.com/800x800.png?text=Foto+5"></div>
        <div class="gallery-item"><img src="https://via.placeholder.com/400x400.png?text=Foto+6" alt="Foto 6" data-src="https://via.placeholder.com/800x800.png?text=Foto+6"></div>
    </div>

    <div id="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <script src="js/main.js"></script>

</body>
</html>
