<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogalerie</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Fotogalerie</h1>
    </header>

    <div class="gallery">
        <!-- Instagram Feed Simulation -->
        <div class="gallery-item">
            <img src="https://picsum.photos/400/400?random=1" 
                 alt="Sommerurlaub am Strand" 
                 data-src="https://picsum.photos/800/800?random=1">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/400?random=2" 
                 alt="Leckeres Essen im Restaurant" 
                 data-src="https://picsum.photos/800/800?random=2">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/400?random=3" 
                 alt="Stadtbummel am Wochenende" 
                 data-src="https://picsum.photos/800/800?random=3">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/400?random=4" 
                 alt="Wanderung in den Bergen" 
                 data-src="https://picsum.photos/800/800?random=4">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/400?random=5" 
                 alt="Mein neuer Arbeitsplatz" 
                 data-src="https://picsum.photos/800/800?random=5">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/400?random=6" 
                 alt="Sonnenuntergang" 
                 data-src="https://picsum.photos/800/800?random=6">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/400?random=7" 
                 alt="Konzertbesuch" 
                 data-src="https://picsum.photos/800/800?random=7">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/400?random=8" 
                 alt="Architektur Fotografie" 
                 data-src="https://picsum.photos/800/800?random=8">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/400?random=9" 
                 alt="Kaffee Pause" 
                 data-src="https://picsum.photos/800/800?random=9">
        </div>
    </div>

    <div id="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <script src="js/main.js"></script>

</body>
</html>
